        报告：写到 `.work/.evolution/{timestamp}/sub-reports/01-concurrent_review-{timestamp}.md`，包含固定头 6 字段、8 字段主体、uncertainty、missing_evidence、result_class、retry_fingerprint、provenance 五字段。
