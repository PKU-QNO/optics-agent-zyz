        |------|---------|------|
        | GUIDING | "这么做成功了，值得记住" | "先做网格收敛再跑全波，避免发散" |
        | CAUTIONARY | "这么做失败了，别这样" | "材料虚部没确认就跑全波，结果全错" |
        | FACT | 客观、可验证的碎片信息 | "Fig3 波长范围 600-800nm" |
