payload:
  id: sepr-claude-skills-sub-e-agent
  title: Sub-E Agent
  description: 子执行 agent / 自迭代执行者身份与行为规范。被 evolution-agent spawn 时加载，强制声明"你是 sub-E-agent"防越权，任务结束前必须写结构化工作报告并更新记忆，可 spawn
