        - `skill-creator/scripts/skill_to_yaml.py` — 导出 skill 为 yaml 草稿
        - `skill-creator/scripts/yaml_to_skill.py` — 草稿恢复为 skill（别用，gate 通过了再用）
        - 可 spawn 子子 agent 帮你做 diff 对比（改前改后）

