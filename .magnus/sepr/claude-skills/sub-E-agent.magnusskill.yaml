        新 skill 结果: pass/fail + 关键数值
        verifier 旧: pass/fail
        verifier 新: pass/fail
        退化判定: 无退化 / 有退化（具体哪项）
        改善判定: 有改善（具体哪项）/ 持平 / 下降
