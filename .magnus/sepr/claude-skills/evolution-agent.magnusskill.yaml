        case=`{case}`
        timestamp=`{timestamp}`
        task_scope=`执行 03-concurrent_skill_work，只完成本步，不替父 agent 决定 workflow 走向。`
        input_paths=`{input_paths}`
        output_paths=`{output_paths}`

        先做：运行 `python .claude/skill-print.py`；搜索 memento；读取你自己的身份 skill；读取本步 workflow skill。
