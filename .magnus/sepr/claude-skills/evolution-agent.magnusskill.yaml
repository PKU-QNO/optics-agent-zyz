  title: Evolution Agent
  description: 编排者身份与自迭代工作流编排规范。claude 作为 evolution-agent 启动时加载，负责读自迭代设计、决定 spawn 哪个 sub-E-agent、在人工 gate 停顿、汇总子报告、写 evolution
    总结报告并更新记忆。Use when claude is the orchestrator for self-iteration workflow (not paper reproduction).
  files:
