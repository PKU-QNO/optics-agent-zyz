        【必须回答的决策问题】1. 你改了什么？为什么改？哪篇 capsule 支撑的？2. 有没有改超出 skill 范围（碰了拓扑/蓝图/AGENTS）？3. 改动会不会导致旧 case 退化？4. 草稿完整性——有没有遗漏原 skill 的关键部分？5. 你觉得还需不需要额外的 case 验证？哪些？
