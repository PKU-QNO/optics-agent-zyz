    - path: references/openai_yaml.md
      content: |
        # openai.yaml fields (full example + descriptions)

        `agents/openai.yaml` is an extended, product-specific config intended for the machine/harness to read, not the agent. Other product-specific config can also live in the `agents/` folder.

        ## Full example

        ```yaml
        interface:
          display_name: "Optional user-facing name"
          short_description: "Optional user-facing description"
          icon_small: "./assets/small-400px.png"
          icon_large: "./assets/large-logo.svg"
          brand_color: "#3B82F6"
          default_prompt: "Optional surrounding prompt to use the skill with"

        dependencies:
          tools:
            - type: "mcp"
              value: "github"
              description: "GitHub MCP server"
              transport: "streamable_http"
              url: "https://api.githubcopilot.com/mcp/"

        policy:
          allow_implicit_invocation: true
        ```

        ## Field descriptions and constraints

        Top-level constraints:

        - Quote all string values.
        - Keep keys unquoted.
        - For `interface.default_prompt`: generate a helpful, short (typically 1 sentence) example starting prompt based on the skill. It must explicitly mention the skill as `$skill-name` (e.g., "Use $skill-name-here to draft a concise weekly status update.").

        - `interface.display_name`: Human-facing title shown in UI skill lists and chips.
        - `interface.short_description`: Human-facing short UI blurb (25–64 chars) for quick scanning.
        - `interface.icon_small`: Path to a small icon asset (relative to skill dir). Default to `./assets/` and place icons in the skill's `assets/` folder.
        - `interface.icon_large`: Path to a larger logo asset (relative to skill dir). Default to `./assets/` and place icons in the skill's `assets/` folder.
        - `interface.brand_color`: Hex color used for UI accents (e.g., badges).
        - `interface.default_prompt`: Default prompt snippet inserted when invoking the skill.
        - `dependencies.tools[].type`: Dependency category. Only `mcp` is supported for now.
        - `dependencies.tools[].value`: Identifier of the tool or dependency.
        - `dependencies.tools[].description`: Human-readable explanation of the dependency.
        - `dependencies.tools[].transport`: Connection type when `type` is `mcp`.
        - `dependencies.tools[].url`: MCP server URL when `type` is `mcp`.
        - `policy.allow_implicit_invocation`: When false, the skill is not injected into
          the model context by default, but can still be invoked explicitly via `$skill`.
          Defaults to true.
    - path: scripts/generate_openai_yaml.py
      content: "#!/usr/bin/env python3\r\n\"\"\"\r\nOpenAI YAML Generator - Creates agents/openai.yaml for a skill folder.\r\
        \n\r\nUsage:\r\n    generate_openai_yaml.py <skill_dir> [--name <skill_name>] [--interface key=value]\r\n\"\"\"\r\n\
        \r\nimport argparse\r\nimport re\r\nimport sys\r\nfrom pathlib import Path\r\n\r\nACRONYMS = {\r\n    \"GH\",\r\n\
        \    \"MCP\",\r\n    \"API\",\r\n    \"CI\",\r\n    \"CLI\",\r\n    \"LLM\",\r\n    \"PDF\",\r\n    \"PR\",\r\n  \
        \  \"UI\",\r\n    \"URL\",\r\n    \"SQL\",\r\n}\r\n\r\nBRANDS = {\r\n    \"openai\": \"OpenAI\",\r\n    \"openapi\"\
        : \"OpenAPI\",\r\n    \"github\": \"GitHub\",\r\n    \"pagerduty\": \"PagerDuty\",\r\n    \"datadog\": \"DataDog\"\
        ,\r\n    \"sqlite\": \"SQLite\",\r\n    \"fastapi\": \"FastAPI\",\r\n}\r\n\r\nSMALL_WORDS = {\"and\", \"or\", \"to\"\
        , \"up\", \"with\"}\r\n\r\nALLOWED_INTERFACE_KEYS = {\r\n    \"display_name\",\r\n    \"short_description\",\r\n \
        \   \"icon_small\",\r\n    \"icon_large\",\r\n    \"brand_color\",\r\n    \"default_prompt\",\r\n}\r\n\r\n\r\ndef\
        \ yaml_quote(value):\r\n    escaped = value.replace(\"\\\\\", \"\\\\\\\\\").replace('\"', '\\\\\"').replace(\"\\n\"\
        , \"\\\\n\")\r\n    return f'\"{escaped}\"'\r\n\r\n\r\ndef format_display_name(skill_name):\r\n    words = [word for\
        \ word in skill_name.split(\"-\") if word]\r\n    formatted = []\r\n    for index, word in enumerate(words):\r\n \
        \       lower = word.lower()\r\n        upper = word.upper()\r\n        if upper in ACRONYMS:\r\n            formatted.append(upper)\r\
        \n            continue\r\n        if lower in BRANDS:\r\n            formatted.append(BRANDS[lower])\r\n         \
        \   continue\r\n        if index > 0 and lower in SMALL_WORDS:\r\n            formatted.append(lower)\r\n        \
        \    continue\r\n        formatted.append(word.capitalize())\r\n    return \" \".join(formatted)\r\n\r\n\r\ndef generate_short_description(display_name):\r\
        \n    description = f\"Help with {display_name} tasks\"\r\n\r\n    if len(description) < 25:\r\n        description\
        \ = f\"Help with {display_name} tasks and workflows\"\r\n    if len(description) < 25:\r\n        description = f\"\
        Help with {display_name} tasks with guidance\"\r\n\r\n    if len(description) > 64:\r\n        description = f\"Help\
        \ with {display_name}\"\r\n    if len(description) > 64:\r\n        description = f\"{display_name} helper\"\r\n \
        \   if len(description) > 64:\r\n        description = f\"{display_name} tools\"\r\n    if len(description) > 64:\r\
        \n        suffix = \" helper\"\r\n        max_name_length = 64 - len(suffix)\r\n        trimmed = display_name[:max_name_length].rstrip()\r\
        \n        description = f\"{trimmed}{suffix}\"\r\n    if len(description) > 64:\r\n        description = description[:64].rstrip()\r\
        \n\r\n    if len(description) < 25:\r\n        description = f\"{description} workflows\"\r\n        if len(description)\
        \ > 64:\r\n            description = description[:64].rstrip()\r\n\r\n    return description\r\n\r\n\r\ndef read_frontmatter_name(skill_dir):\r\
        \n    skill_md = Path(skill_dir) / \"SKILL.md\"\r\n    if not skill_md.exists():\r\n        print(f\"[ERROR] SKILL.md\
        \ not found in {skill_dir}\")\r\n        return None\r\n    content = skill_md.read_text()\r\n    match = re.match(r\"\
        ^---\\n(.*?)\\n---\", content, re.DOTALL)\r\n    if not match:\r\n        print(\"[ERROR] Invalid SKILL.md frontmatter\
        \ format.\")\r\n        return None\r\n    frontmatter_text = match.group(1)\r\n\r\n    import yaml\r\n\r\n    try:\r\
        \n        frontmatter = yaml.safe_load(frontmatter_text)\r\n    except yaml.YAMLError as exc:\r\n        print(f\"\
        [ERROR] Invalid YAML frontmatter: {exc}\")\r\n        return None\r\n    if not isinstance(frontmatter, dict):\r\n\
        \        print(\"[ERROR] Frontmatter must be a YAML dictionary.\")\r\n        return None\r\n    name = frontmatter.get(\"\
        name\", \"\")\r\n    if not isinstance(name, str) or not name.strip():\r\n        print(\"[ERROR] Frontmatter 'name'\
        \ is missing or invalid.\")\r\n        return None\r\n    return name.strip()\r\n\r\n\r\ndef parse_interface_overrides(raw_overrides):\r\
        \n    overrides = {}\r\n    optional_order = []\r\n    for item in raw_overrides:\r\n        if \"=\" not in item:\r\
        \n            print(f\"[ERROR] Invalid interface override '{item}'. Use key=value.\")\r\n            return None,\
        \ None\r\n        key, value = item.split(\"=\", 1)\r\n        key = key.strip()\r\n        value = value.strip()\r\
        \n        if not key:\r\n            print(f\"[ERROR] Invalid interface override '{item}'. Key is empty.\")\r\n  \
        \          return None, None\r\n        if key not in ALLOWED_INTERFACE_KEYS:\r\n            allowed = \", \".join(sorted(ALLOWED_INTERFACE_KEYS))\r\
        \n            print(f\"[ERROR] Unknown interface field '{key}'. Allowed: {allowed}\")\r\n            return None,\
        \ None\r\n        overrides[key] = value\r\n        if key not in (\"display_name\", \"short_description\") and key\
        \ not in optional_order:\r\n            optional_order.append(key)\r\n    return overrides, optional_order\r\n\r\n\
        \r\ndef write_openai_yaml(skill_dir, skill_name, raw_overrides):\r\n    overrides, optional_order = parse_interface_overrides(raw_overrides)\r\
        \n    if overrides is None:\r\n        return None\r\n\r\n    display_name = overrides.get(\"display_name\") or format_display_name(skill_name)\r\
        \n    short_description = overrides.get(\"short_description\") or generate_short_description(display_name)\r\n\r\n\
        \    if not (25 <= len(short_description) <= 64):\r\n        print(\r\n            \"[ERROR] short_description must\
        \ be 25-64 characters \"\r\n            f\"(got {len(short_description)}).\"\r\n        )\r\n        return None\r\
        \n\r\n    interface_lines = [\r\n        \"interface:\",\r\n        f\"  display_name: {yaml_quote(display_name)}\"\
        ,\r\n        f\"  short_description: {yaml_quote(short_description)}\",\r\n    ]\r\n\r\n    for key in optional_order:\r\
        \n        value = overrides.get(key)\r\n        if value is not None:\r\n            interface_lines.append(f\"  {key}:\
        \ {yaml_quote(value)}\")\r\n\r\n    agents_dir = Path(skill_dir) / \"agents\"\r\n    agents_dir.mkdir(parents=True,\
        \ exist_ok=True)\r\n    output_path = agents_dir / \"openai.yaml\"\r\n    output_path.write_text(\"\\n\".join(interface_lines)\
        \ + \"\\n\")\r\n    print(f\"[OK] Created agents/openai.yaml\")\r\n    return output_path\r\n\r\n\r\ndef main():\r\
        \n    parser = argparse.ArgumentParser(\r\n        description=\"Create agents/openai.yaml for a skill directory.\"\
        ,\r\n    )\r\n    parser.add_argument(\"skill_dir\", help=\"Path to the skill directory\")\r\n    parser.add_argument(\r\
        \n        \"--name\",\r\n        help=\"Skill name override (defaults to SKILL.md frontmatter)\",\r\n    )\r\n   \
        \ parser.add_argument(\r\n        \"--interface\",\r\n        action=\"append\",\r\n        default=[],\r\n      \
        \  help=\"Interface override in key=value format (repeatable)\",\r\n    )\r\n    args = parser.parse_args()\r\n\r\n\
        \    skill_dir = Path(args.skill_dir).resolve()\r\n    if not skill_dir.exists():\r\n        print(f\"[ERROR] Skill\
        \ directory not found: {skill_dir}\")\r\n        sys.exit(1)\r\n    if not skill_dir.is_dir():\r\n        print(f\"\
