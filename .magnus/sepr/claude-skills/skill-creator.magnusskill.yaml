payload:
  id: sepr-claude-skills-skill-creator
  title: Skill Creator
  description: Guide for creating effective skills. This skill should be used when users want to create a new skill (or update
    an existing skill) that extends Codex's capabilities with specialized knowledge, workflows, or tool integrations.
  files:
