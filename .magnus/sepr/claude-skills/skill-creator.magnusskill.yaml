      content: "interface:\r\n  display_name: \"Skill Creator\"\r\n  short_description: \"Create or update a skill\"\r\n \
        \ icon_small: \"./assets/skill-creator-small.svg\"\r\n  icon_large: \"./assets/skill-creator.png\"\r\n"
