  title: Optics Mie Reproduction
  description: Mie theory analytical/semi-analytical scattering calculations for optics_agent — single sphere, metal LSPR,
    dielectric modes, core-shell, periodic arrays, binary arrays, effective medium. Use when the task involves Mie scattering,
    Lorenz-Mie coefficients, scattering/absorption/extinction cross sections, Drude dispersion LSPR, dielectric nanosphere
    magnetic dipole modes, core-shell recursive Mie, coupled dipole approximation (CDA), surface lattice resonances (SLR),
    Rayleigh anomaly, binary nanoparticle arrays, S-parameter retrieval effective medium, Maxwell-Garnett, Mie-vs-Bragg phase
    diagram, or building Python-only scattering benchmark data for later COMSOL validation. Also use when writing Mie physical
