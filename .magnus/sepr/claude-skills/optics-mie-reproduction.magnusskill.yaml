    - path: agents/openai.yaml
      content: |
        display_name: Optics Mie Reproduction
        short_description: Mie theory analytical scattering — single sphere, LSPR, dielectric modes, core-shell, arrays, effective medium, with physical verifiers and quantitative paper-figure checks.
        default_prompt: Reproduce a Mie scattering paper figure with Python, following the 3-layer verification workflow in optics-mie-reproduction.
    - path: references/benchmark_format.md
      content: |
        # benchmark.yaml Format

        `reproduction_test/mie/data/benchmark.yaml` is the frozen standard-answer file. Start it at stage 1 and append per stage — never overwrite. This file is the validation target for later COMSOL runs and the reward signal for workflow self-iteration experiments.

        ## Schema

        ```yaml
        version: 1
        last_updated: <YYYY-MM-DD>
        cases:
          - case_id: <string>          # e.g. akimov_single_sphere_n1p5
            stage: <int>               # 1-7
            paper: <string>            # short name, e.g. Akimov
            figure_ref: <string>       # paper figure identifier
            parameters:
              geometry:                # radius, layer stack, etc.
              materials:               # wavelength range, complex permittivity, dispersion source
              environment:             # background index
            expected:
              observable: <string>     # e.g. Q_sca, C_ext, LSPR_wavelength, n_eff
              values:                  # list of (param, expected_value) points
                - point: {x: 0.1}
                  value: 0.0009
                - point: {x: 1.0}
                  value: 0.21
              trends:                  # qualitative trends to check
                - "Q_sca proportional to x^4 at small x"
                - "Q_ext approaches 2 at large x"
            tolerance:
              cross_section_relative: 1.0e-6
              peak_wavelength_nm: 5
              q_factor_relative: 0.10
              rmse_peak_fraction: 0.05
            provenance:
              our_impl:                # values from our code
              paper_figure:            # values digitized from paper
            two_way_agreement: <pass|partial|fail|pending>
            verifier_results:
              energy_conservation: <pass|fail>
              rayleigh_limit: <pass|fail>
              large_size_limit: <pass|fail|na>
            human_gate_4: <pass|fail|pending>   # human reviewed quantitative comparison
            notes: <string>            # caveats, simplifications, missing info
        ```

        ## Example Entry (stage 1, placeholder until implementation runs)

        ```yaml
        cases:
          - case_id: akimov_single_sphere_n1p5
            stage: 1
            paper: Akimov
            figure_ref: "Fig. Q_sca(x)"
            parameters:
              geometry: {sphere_radius_m: 1.0e-6}
              materials: {sphere_index: 1.5, background_index: 1.0, loss_imag: 0.0}
              environment: {wavelength_range_m: [0.1e-6, 30e-6]}
            expected:
              observable: Q_sca
              values:
                - point: {x: 0.1}
                  value: 0.0009
                - point: {x: 1.0}
                  value: 0.21
              trends:
                - "Q_sca proportional to x^4 at small x"
                - "Q_ext approaches 2 at large x"
            tolerance:
              cross_section_relative: 1.0e-6
              peak_wavelength_nm: 5
              q_factor_relative: 0.10
              rmse_peak_fraction: 0.05
            provenance:
              our_impl: pending
              paper_figure: pending
            two_way_agreement: pending
            verifier_results:
              energy_conservation: pending
              rayleigh_limit: pending
              large_size_limit: pending
            human_gate_4: pending
            notes: "Stage 1 baseline; values to be filled after implementation."
        ```

        ## Rules

        - Append-only within a case; never overwrite a frozen value. If a value is corrected, add a new case_id suffix `_v2` and mark the old one `superseded_by`.
        - `two_way_agreement` becomes `pass` only when our impl and the paper figure agree within tolerance. `partial` means they disagree — investigate, do not proceed.
        - `human_gate_4` is set by the human after reviewing quantitative numbers, never by the AI.
        - Tolerances are set by the human, not auto-derived from the implementation.
    - path: references/papers.md
      content: |
        # Mie Reproduction Papers（课程表 + 学习目标；不含论文内容断言）

        11 papers, executed in 7 stages by increasing difficulty. Each stage has one main paper plus optional references. Non-arXiv PDFs are in `papers/mie/`; arXiv papers are accessible directly.

        ## ⚠ 本文件契约（2026-07-04 修订，首跑教训）

        本文件只承载两类信息，**不承载第三类**：

        1. **课程表层（可信）**：论文属于哪个 Stage、为什么选它、PDF 在哪、难度排序、来源可信度提醒。这是人工制定的教学计划。
        2. **学习目标层（可信，但它是"我们要产出什么"）**：每条 `Deliverables` 是**我们这个 Stage 想写出的代码/曲线/验证**，**不是**"论文里有这张图"的断言。我们的交付曲线可能在论文里根本没有对应图——那不影响交付，但不能拿它当复现比对目标。
        3. **论文内容断言（本文件不提供）**：论文里实际有哪些图、哪些曲线、哪些可比对的定量目标，**一律由 W-flow step02（paper_reading）对论文原文/LaTeX 源提取，产出 `figures.md`，过 gate① 人工核对后才生效**。本文件中任何看似描述论文内容的句子都只是**未核实线索（unverified hint）**，与 step02 产出冲突时**以 step02 为准**。

        **为什么有这条契约**：2026-07-03 首跑 Akimov 时，本文件旧版断言该论文含 "$Q_{sca}(x)$ curve, Rayleigh→Mie→geometric transition"——step02 逐图核对证实**论文 12 张图里没有这条曲线**，整个"复现哪张图"的预设目标是虚构的（declared-vs-actual，写描述的人没读过原文）。sub-agent 盲信此类描述会跑偏。故所有内容断言已从本文件移除或降级为线索。

        ---

        ## Stage 1 — Single-sphere Mie basics

        ### Akimov — Mie scattering theory: a review (arXiv 2401.04146, 2024)

        **选篇理由**：单球 Lorenz-Mie 的系统 review，覆盖多极展开系数的物理来源，适合作第一阶段的公式主线索引。**注意它是 review，不是有原创数据图的研究论文——可比对的目标图偏理论 loci / 系数谱类**（此点已由 2026-07-03 首跑 step02 证实）。

        - **Deliverables（我们的交付，非论文图）**: `code/mie_coefficients.py`（$a_n, b_n$）、`code/scattering.py`（cross sections）、$Q_{sca}(x)$ curve for $n=1.5,2,3,4$（教学用基线曲线，**论文中无此图**）、multipole decomposition。
        - **Verification**: energy conservation, Rayleigh $x^4$, large-size $Q\to2$。
        - **复现目标图**：由 step02 的 `figures.md` 确定（2026-07-03 首跑已产出：`.work/.todo/2401.04146/0703-01-akimov-mie-v1/figures.md`；候选为 Fig3 超辐射/非辐射 loci、Fig5(c)(f) $|a_1|,|b_1|$ 谱、Fig6 超吸收 loci）。
        - **Caveat**: Akimov is a review and may have typos; verify $a_n,b_n$ against Bohren & Huffman or Kerker, use Akimov only as cross-check。教材 `.paper/scattering.pdf` 是公式主源。

        ## Stage 2 — Metal sphere LSPR

        ### Colas des Francs — Mie plasmons: modes volumes, quality factors and coupling strengths (arXiv 1112.2814, 2011)

        **选篇理由**：金属纳米球 LSPR 的 Mie 展开，含模式体积/品质因子/Purcell 因子的闭式表达，适合引入 Drude 色散。（内容细节属未核实线索，step02 核。）

        - **Deliverables**: `code/drude.py`（Au/Ag Drude）、`code/lspr.py`、LSPR wavelength vs radius（$R=10,20,50,100$ nm）、Purcell factor spectrum。
        - **Verification**: quasi-static LSPR $\mathrm{Re}(\varepsilon)=-2\varepsilon_d$。
        - **Physics（学习点）**: quasi-static（$a_1$-dominated）与 full Mie expansion 的差异。
        - **复现目标图**：step02 产出后定。

        ## Stage 3 — Dielectric sphere Mie modes

        ### Main paper: to be supplemented via Web of Science

        References: García-Etxarri et al. (2011); Kuznetsov et al. "Magnetic light" (Sci. Rep. 2012); Evlyukhin et al. "Demonstration of Magnetic Dipole Resonances of Dielectric Nanospheres" (Nano Lett. 2012); Kuznetsov et al. "Optically resonant dielectric nanostructures" (Science 2016).

        **选篇理由**：高折射率介质球通过内部位移电流支持更丰富的 Mie 模式（磁/电偶极、四极），损耗低于等离激元结构——与 Stage 2 形成对照。

        - **Deliverables**: dielectric sphere extinction spectrum、multipole decomposition、magnetic dipole mode visualization。
        - **Physics（学习点）**: 内部环流位移电流产生磁偶极；共振由 size parameter 和折射率决定；电/磁偶极比决定 Kerker 条件。
        - **复现目标图**：主论文定稿后由 step02 产出。

        ## Stage 4 — Core-shell Mie

        ### Tam — Mesoscopic nanoshells (JCP 127, 2007) — `papers/mie/204703_1_online.pdf`

        **选篇理由**：两层 Lorenz-Mie 的 core-shell 消光计算；引入两层边界条件的递推。（"quasi-static 在厚/薄壳都失效、需全级数"属未核实线索，step02 核。）

        - **Deliverables**: `code/core_shell_mie.py`、extinction spectra vs shell thickness、shell-thickness–resonance-wavelength map、quasi-static vs full Mie comparison。
        - **Verification**: shell-thickness→∞ collapses to single sphere (core material); core→0 collapses to single sphere (shell material)。
        - **Reference**: Arruda, "Toroidal dipole in core-shell spheres" (arXiv 2406.06800)。
        - **复现目标图**：step02 产出后定。

        ## Stage 5 — Periodic array collective resonance (SLR)

        ### Auguie & Barnes — Collective Resonances in Gold Nanoparticle Arrays (PRL 101, 2008) — `papers/mie/PhysRevLett.101.143902.pdf`

        **选篇理由**：周期阵列中 Rayleigh anomaly 与 LSPR 耦合产生高 Q 表面晶格共振（SLR），是从单球到周期系统的过渡。（线宽由周期决定等细节属未核实线索。）

        - **Deliverables**: `code/coupled_dipole.py`（CDA）、extinction spectra vs period（标注 Rayleigh anomaly 与 SLR）、linewidth-vs-period curve。
        - **Verification**: Rayleigh anomaly $\lambda=P\cdot n_{\text{eff}}$; large period collapses to single sphere。
        - **Reference**: Gerasimov, "Plasmonic lattice Kerker effect" (arXiv 2007.13317)。
        - **复现目标图**：step02 产出后定。

        ## Stage 6 — Binary array geometric resonance

        ### Li J et al. — Tuning of narrow geometric resonances in Ag/Au binary nanoparticle arrays (Opt. Express 18, 2010) — `papers/mie/Li_J_OE2010.pdf` or `papers/mie/oe-18-17-17684.pdf`

        **选篇理由**：两种材料/尺寸的二元阵列，通过尺寸比独立调谐几何共振位置与线宽——CDA 引入两种单粒子极化率。（细节属未核实线索。）

        - **Deliverables**: `code/binary_cda.py`、extinction spectra vs size ratio、linewidth-vs-size-ratio curve。
        - **Verification**: large period collapses to single-particle result。
        - **复现目标图**：step02 产出后定。

        ## Stage 7 — Effective refractive index and phase diagram

        ### Rybin — Phase diagram for the transition from photonic crystals to dielectric metamaterials (Nat. Commun. 6, 2015) — `papers/mie/Rybin_NatComm2015.pdf`

        **选篇理由**：比较 Mie 共振波长与 Bragg 共振波长，在介电常数–填充率平面构建光子晶体/超材料相图——把阵列散射响应浓缩为有效光学参数。（细节属未核实线索。）

        - **Deliverables**: `code/effective_medium.py`（S-parameter retrieval of $\varepsilon_{\text{eff}}, \mu_{\text{eff}}$）、`code/phase_diagram.py`、$n_{\text{eff}}$ dispersion、$(\varepsilon, P/\lambda)$ phase diagram。
        - **Verification**: low filling fraction → Maxwell-Garnett。
        - **复现目标图**：step02 产出后定。

        ## Optional Papers (clear attachment points)

        | Paper | arXiv | 选篇理由（线索级） | Attachment |
        |---|---|---|---|
        | Tagviashvili | 0910.3305 | ENZ-limit Mie scattering | effective medium $n_{\text{eff}}\to0$ |
        | Shamkhi | 1808.10708 | generalized Kerker transverse scattering | array angular scattering |
        | Arruda | 2406.06800 | core-shell toroidal dipole | core-shell extension |
        | Nieto-Vesperinas | 1201.6146 | Si sphere Kerker condition | single-sphere directional scattering |

        ## Execution Order Summary

        Stage 1 (single sphere) → Stage 2 (metal LSPR) → Stage 3 (dielectric modes) → Stage 4 (core-shell) → Stage 5 (SLR) → Stage 6 (binary array) → Stage 7 (effective medium). Optional papers attach to their stated stages. Do not skip ahead — each stage's verifier depends on the previous stage's implementation being correct.

        **每个 Stage 开跑时的第一步都是 step01/02 对论文原文提取图清单并过 gate①，本文件不预设任何一张目标图。**
    - path: references/verification.md
      content: |
        # Mie Verification — 3 Layers

        Never judge success by eye against paper figures. Run the 3 layers easiest-first. A stage passes only when all applicable layers pass.

        ## Layer 1 — Physical Hard Constraints (parameter-independent)

        These hold for any parameters; AI cannot fake them; a human without Mie knowledge can judge them because they are common-sense physics.

        | # | Constraint | Check | Tolerance |
        |---|---|---|---|
        | 1.1 | Energy conservation | $C_{ext}=C_{sca}+C_{abs}$ | $10^{-10}$ relative |
        | 1.2 | Zero absorption when lossless | $\mathrm{Im}(\varepsilon)=0 \Rightarrow C_{abs}=0$ | $10^{-12}$ |
        | 1.3 | Optical theorem | $C_{ext}=\frac{4\pi}{k}\mathrm{Im}\,S(0)$ | $10^{-8}$ relative |
        | 1.4 | Rayleigh limit | $Q_{sca}\propto x^4$ as $x\to0$ | log-log slope $=4\pm0.01$ |
        | 1.5 | Large-size extinction paradox | $Q_{ext}\to2$ as $x\to\infty$ | **trend criterion**: $Q_{ext}$ monotonically approaches 2 with growing $x$; end-point $x=800$ gives $\|Q_{ext}-2\|<0.05$（见下方适用条件） |
        | 1.6 | Spherical symmetry | scattering independent of incident polarization | exact |

        Layer 1 passing only means "no big mistake"; it does NOT certify numerical accuracy. Layers 2-3 are still required.

        **1.5 适用条件（2026-07-05 修订，Akimov case 首跑 Gate3 教训）**：$Q_{ext}\to2$ 对**无损介质球收敛极慢**（代数收敛 ~$1/x$ 边缘衍射修正）——$x=200$ 仍偏 0.09，单点 $\|Q_{ext}-2\|<0.05$ 需 $x\gtrsim1000$。弱阻尼（$m$ 带小虚部）只衰减叠加的 ripple 抖动，**压不掉慢收敛主偏离**。故 1.5 判据是**趋势判据**（$Q_{ext}$ 随 $x$ 单调趋 2 + 末点 $x=800$ 达 0.05），不是"某几点精确达 2"。**失败含义**：若趋势不单调下降或末点远大于 0.05 → 结构性实现错（如漏 $b_l$ 项、系数错半）；单点 ripple 反弹 ≤0.02 属正常。**不适用**：强吸收球（$Q_{ext}$ 不趋 2 而趋更大值）不该用本判据。早先硬编码 $xs=[50,80,120,200]$+固定 tol 的版本会对正确的无损实现假阴性（verifier 自身缺陷），已废。

        ## Layer 2 — Known Limits / Degeneracies

        | # | Limit | Expected behavior |
        |---|---|---|
        | 2.1 | Metal sphere quasi-static LSPR | $\mathrm{Re}(\varepsilon)=-2\varepsilon_d$ (textbook formula) |
        | 2.2 | Core-shell shell-thickness→∞ | collapses to single sphere of core material |
        | 2.3 | Core-shell core→0 | collapses to single sphere of shell material |
        | 2.4 | Array period→∞ | collapses to single-sphere result |
        | 2.5 | Low filling fraction | effective parameters → Maxwell-Garnett formula |

        These are "known-answer limits". A mismatch signals a structural implementation error.

        ## Layer 3 — Quantitative Paper-Figure Comparison

        Not "overlay and eyeball". Compute numeric metrics:

        | Metric | Default tolerance |
        |---|---|
        | Curve RMSE vs digitized paper curve | $<5\%$ of peak value |
        | Resonance peak wavelength error | $<5$ nm (visible) or $<1\%$ (IR) |
        | Q-factor relative error | $<10\%$ |
        | Peak amplitude relative error | $<10\%$ |

        Tolerances are written into `data/benchmark.yaml` per case. The human sets tolerances, not the AI.

        Report must distinguish "visual overlay consistent" from "within quantitative tolerance" — the former does not count as passing.

        ## Verifier Scripts

        All scripts live in `scripts/` and import from `reproduction_test/mie/code/`. They fail with a clear message if the implementation is not yet present.

        - `check_energy_conservation.py` — Layer 1.1, sweeps a parameter range and reports max relative error.
        - `check_rayleigh_limit.py` — Layer 1.4, fits log-log slope at small $x$.
        - `check_large_size_limit.py` — Layer 1.5, checks $Q_{ext}$ at large $x$.

        Each script exits 0 on PASS, non-zero on FAIL, and prints a one-line verdict plus the numeric evidence.

        ## The 30-Minute Human Check Per Paper

        1. Run 3 physical verifier scripts (auto, 5 min) — all must pass.
        2. Verify core formula 2-3 lines against textbook (human, 10 min) — the most critical 10 minutes.
        3. Quantitative paper-figure comparison (auto + human, 5 min) — read RMSE and peak-error numbers.
        4. Physical intuition check (human, 5 min) — is the peak where it should be? Is the shape right?

        Steps 2 and 4 are irreplaceable human work. Steps 1, 3 are automated but the human reads the results.
    - path: scripts/check_energy_conservation.py
      content: |
        """Layer 1.1 verifier: energy conservation C_ext = C_sca + C_abs.

        Imports from reproduction_test/mie/code/. Fails with a clear message if the
        implementation is not yet present. Exits 0 on PASS, non-zero on FAIL.
        """
        from __future__ import annotations
        import sys
        import numpy as np

        CODE_DIR = "reproduction_test/mie/code"
        if CODE_DIR not in sys.path:
            sys.path.insert(0, CODE_DIR)

        TOL_REL = 1e-10


        def main() -> int:
            try:
                from scattering import compute_cross_sections  # type: ignore
            except ImportError as e:
                print(f"FAIL: implementation not found ({e}). Run after stage 1 code is written.")
                return 2

            # Sweep a representative parameter range: dielectric and metal, small and large x.
            test_cases = [
                {"m": 1.5 + 0.0j, "x": 1.0, "label": "dielectric x=1"},
                {"m": 1.5 + 0.1j, "x": 1.0, "label": "lossy dielectric x=1"},
                {"m": 0.05 + 3.0j, "x": 2.0, "label": "metal x=2"},
                {"m": 1.5 + 0.0j, "x": 20.0, "label": "dielectric x=20"},
            ]

            max_err = 0.0
            worst = ""
            for c in test_cases:
                try:
                    cext, csca, cabs = compute_cross_sections(m=c["m"], x=c["x"])
                except Exception as e:
                    print(f"FAIL: compute_cross_sections raised {e} for {c['label']}")
                    return 1
                err = abs(cext - (csca + cabs))
                rel = err / max(abs(cext), 1e-30)
                if rel > max_err:
                    max_err = rel
                    worst = c["label"]

            if max_err < TOL_REL:
                print(f"PASS energy_conservation: max relative error {max_err:.3e} (worst: {worst})")
                return 0
            print(f"FAIL energy_conservation: max relative error {max_err:.3e} (worst: {worst}), tol {TOL_REL:.0e}")
            return 1


        if __name__ == "__main__":
            sys.exit(main())
    - path: scripts/check_large_size_limit.py
      content: |
        """Layer 1.5 verifier: large-size extinction paradox Q_ext -> 2 at large x.

        物理内核：大尺寸消光佯谬 Q_ext -> 2（衍射极限，遮挡 πR² + 前向衍射各贡献 1）。

        设计教训（2026-07-05，Akimov case 首跑 Gate3）：早先版本硬编码
        xs=[50,80,120,200] + tol=0.05，对无损介质球 m=1.5 会 FAIL——不是实现 bug，
        是 verifier 设计缺陷。经独立复算确认两点：
          (1) Q_ext->2 对无损球收敛极慢（代数收敛 ~1/x 边缘衍射修正），x=200 仍偏
              0.09、x=1000 才 0.014、x=2000 才 0.010；单点 |Q-2|<0.05 需 x≳1000。
          (2) 弱阻尼（m 带小虚部）压不掉主偏离——虚部只衰减叠加的 ripple 抖动，
              不改慢代数收敛趋势（m=1.5+0.1i 在 x=200 仍 0.057）。
        故改为**趋势判据**：不要求某几点精确达 2，而是验证 Q_ext 随 x 单调趋近 2
        （这才是"佯谬"的物理内核，且对慢收敛/ripple 免疫）。三判据全过才 PASS：
          C1 末点（x=800）|Q_ext-2| < 末点容差 0.05
          C2 |Q_ext-2| 随 x 基本单调下降（容 0.02 ripple 反弹）
          C3 首点比末点更偏离 2（整体收敛方向正确）

        双向验证（写此文件时实测，见 case 04 记录）：
          正确实现（无损 m=1.5）-> PASS（末点 0.0163）
          注入 bug 漏 b_l 项      -> FAIL（末点 0.99）
          注入 bug 系数×0.5       -> FAIL（末点 0.49）

        适用条件（对齐 verification.md）：无损或弱阻尼球；判的是"大 x 趋势"，非"某点精确达 2"。
        Imports from reproduction_test/mie/code/. Exits 0 on PASS, non-zero on FAIL.
        """
        from __future__ import annotations
        import sys
        import numpy as np

        CODE_DIR = "reproduction_test/mie/code"
        if CODE_DIR not in sys.path:
            sys.path.insert(0, CODE_DIR)

        TARGET = 2.0
        END_TOL = 0.05        # C1: 末点（最大 x）|Q_ext-2| 容差
        RIPPLE_TOL = 0.02     # C2: 允许的单调下降反弹（ripple）幅度
        XS = np.array([50.0, 100.0, 200.0, 400.0, 800.0])  # 单调递增；末点 x=800


        def main() -> int:
            try:
                from scattering import compute_Q_ext  # type: ignore
            except ImportError as e:
                print(f"FAIL: implementation not found ({e}). Run after stage 1 code is written.")
                return 2

            m = 1.5 + 0.0j
            try:
                qext = np.array([compute_Q_ext(m=m, x=x) for x in XS])
            except Exception as e:
                print(f"FAIL: compute_Q_ext raised {e}")
                return 1

            dev = np.abs(qext - TARGET)

            c1 = dev[-1] < END_TOL                        # 末点接近 2
            c2 = bool(np.all(np.diff(dev) < RIPPLE_TOL))  # 基本单调下降
            c3 = dev[0] > dev[-1]                         # 首点比末点更偏

            table = "  ".join(f"x={x:.0f}:|Q-2|={d:.4f}" for x, d in zip(XS, dev))
            if c1 and c2 and c3:
                print(f"PASS large_size_limit (trend): {table}")
                print(f"  末点 x={XS[-1]:.0f} |Q_ext-2|={dev[-1]:.4f} < {END_TOL}; 单调下降 & 收敛方向正确")
                return 0
            print(f"FAIL large_size_limit (trend): {table}")
            print(f"  C1 末点<{END_TOL}:{c1}  C2 单调下降(容{RIPPLE_TOL}):{c2}  C3 首>末:{c3}")
            return 1


        if __name__ == "__main__":
            sys.exit(main())
    - path: scripts/check_rayleigh_limit.py
      content: |
        """Layer 1.4 verifier: Rayleigh limit Q_sca proportional to x^4 at small x.

        Fits log-log slope of Q_sca vs x over a small-x range; expects slope = 4.
        Imports from reproduction_test/mie/code/. Exits 0 on PASS, non-zero on FAIL.
        """
        from __future__ import annotations
        import sys
        import numpy as np

        CODE_DIR = "reproduction_test/mie/code"
        if CODE_DIR not in sys.path:
            sys.path.insert(0, CODE_DIR)

        EXPECTED_SLOPE = 4.0
        SLOPE_TOL = 0.01


        def main() -> int:
            try:
                from scattering import compute_Q_sca  # type: ignore
            except ImportError as e:
                print(f"FAIL: implementation not found ({e}). Run after stage 1 code is written.")
                return 2

            xs = np.logspace(-3, -1, 20)  # small x regime
            m = 1.5 + 0.0j
            try:
                qsca = np.array([compute_Q_sca(m=m, x=x) for x in xs])
            except Exception as e:
                print(f"FAIL: compute_Q_sca raised {e}")
                return 1

            log_x = np.log10(xs)
            log_q = np.log10(qsca)
            slope, _ = np.polyfit(log_x, log_q, 1)

            if abs(slope - EXPECTED_SLOPE) < SLOPE_TOL:
                print(f"PASS rayleigh_limit: fitted slope {slope:.4f} (expected {EXPECTED_SLOPE}, tol {SLOPE_TOL})")
                return 0
            print(f"FAIL rayleigh_limit: fitted slope {slope:.4f}, expected {EXPECTED_SLOPE} +/- {SLOPE_TOL}")
            return 1


        if __name__ == "__main__":
            sys.exit(main())
