        # 01-pdf_preprocessing（主 agent 视角）

        ## 这步干什么

        把论文 PDF 转成 agent 能用的结构化文本：正文 Markdown、公式、图、表分离。是后续所有步骤的输入。

        ## 输出要求

        - 正文 Markdown（`.work/.todo/{paper}/{case}/paper_text.md`）
        - 公式清单（`.work/.todo/{paper}/{case}/formulas.md`，编号+原文+LaTeX）
        - 图清单（`.work/.todo/{paper}/{case}/figures.md`，编号+caption+是数据图还是示意图）
        - 表清单（`.work/.todo/{paper}/{case}/tables.md`，编号+caption+数值）
        - 图片单独导出到 `.work/.todo/{paper}/{case}/figs/`

        ## 要传达给子 agent 的约定

        - 数据图（有坐标轴/数值）和示意图（结构/流程）要分开标记，数据图后面要数字化
        - 公式必须保留原文上下文，不能只抄公式本身
        - 表格数值必须逐字保留，不能四舍五入
        - 图的 caption 要完整提取

        ## 本步子 agent 必须回答的决策问题

        1. PDF 是扫描版还是电子版？需不需要 OCR？
        2. 公式能不能干净提取，还是需要图片化处理？
        3. 有没有数据图需要数字化（为后面 step 08 量化对比准备）？

        ## 人工 gate

        无（这步是机械处理，不涉及物理判断）

