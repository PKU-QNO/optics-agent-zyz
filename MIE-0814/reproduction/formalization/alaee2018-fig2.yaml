assumptions:
  - "线性、各向同性、均匀介质；球内外 ε 均为常数标量（金球逐 λ 取常数 ε(λ)）"
  - "非磁性：μ = μ₀ 处处成立"
  - "时谐约定 e^{−iωt}（与讲义/Grahn 一致）；J = −iωε₀(ε_r−1)E，与表2 前置 −1/(iω) 自洽"
  - "经典 Mie 框架（B&H Ch.4）；金球直接用 m=n+iκ（Im m>0），host=air 时 ε=m²"
  - "金数据用途分离：JC=论文形状保真（仅覆盖区），Olmon-EV=全区间方法验收，三源分别计算=材料敏感性；mean 列不是权威真值"
  - "x 偏振平面波只激发 m=±1 分量（Y2）"
  - "介电球 (a) 与 Fig.1(a) 同物理 → 数据直接复用 fig1a CSV"

