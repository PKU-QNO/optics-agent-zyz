geometry:
  description: >
    单一均匀球（与第 1/2 轮相同几何），嵌入无限大均匀 host。本轮用**介电球 ε_r=6.25 无色散**为主验证对象
    （方法桥接，避免复色散混杂两个问题域）；金球复 ε 不在本轮范围（缺失字段记录）。
    扫描变量沿用 x_alaee = 2a/λ_d（host=air 时 x_mie = ka = π·x_alaee）。
  parameters:
    host: { epsilon_rd: 1.0, note: "air；ε_d = ε₀ε_rd = ε₀（数值上显式区分 ε_d 与 ε₀，防混）" }
    sphere: { epsilon_r: 6.25, note: "无色散实值（复用第 1/2 轮）", magnetic: "μ=μ₀" }
    path_A_domain: { x_alaee: [0.02, 0.3], points: 150, spacing: linear, note: "长波域（kr ∈ [0.063, 0.942]）；gate 子域 [0.02,0.1]，[0.1,0.3] 仅报告" }
    path_B_domain: { x_alaee: [0.02, 1.0], points: 200, spacing: linear, note: "全域，含低端 0.02–0.2 小宗量段（审查 11 🔴5/🟡4）" }
    path_B_low_x_segment: { x_alaee: [0.02, 0.2], note: "与 path A 报告域 [0.02,0.3] 真实重叠 + Rayleigh 斜率验证" }
  mie_size_param_conversion: "x_mie = ka = π·(2a/λ_d)（host=air；沿用 gate③ 硬性要求，不得直接拿 2a/λ 当 x_mie）"
  coordinate: "球坐标 (r,θ,φ)，球心为原点；内部场 = 解析 Mie 解（c_n/d_n，复用 code/mie_theory.py）"

materials:
  inside:
    epsilon_r: 6.25           # 介电球，无色散
    source: "Alaee 2018 Fig.2(a) caption（n=2.5 → ε=2.5²=6.25；第 1/2 轮已 gate 确认）"
  outside:
    epsilon_host: "ε_d = ε₀ε_rd，ε_rd = 1.0（air）"
  host_absolute_permittivity: "⚠️ 审查 🟡2：C₁/C₂/C₃ 中的 ε 是 **host 绝对介电常数** ε_d = ε₀ε_rd。同步：k_d = ω√(μ₀ε_d)、η_d = √(μ₀/ε_d)、J_S = −iω(ε − ε_d)E。host=air 时 ε_d = ε₀ 退化成立（数值实现仍需显式区分）"
  magnetic: "μ = μ₀ 处处成立（非磁性，与原文假设一致）"
  dispersion: "无（本轮介电球）"

equations:
  conventions:
    time_convention: "e^(−iωt)（与讲义/Grahn/Alaee 第 2 轮一致）；入射 E_i = x̂ E₀ e^{ikz}（原文 (21)）"
    equation_numbering: "式号一律原文编号（Grahn 2012 NJP）。⚠️ 勘误一：审查 09 'Eq.(8–9)' 实为原文 (13)(14)（原文 (8)(9) 是 Maxwell 方程）。⚠️ 勘误二：M^(l) 定义是原文 Eq.(27)（非 Eq.(12)）。⚠️ 勘误三：译本 tex 对 Eq.(13) 第二项转录错误（(d²/dr²+k²)r∇·J 应为 (2+rd/dr)(∇·J)），以原文为准"
    source_equation_local_equation: "每条映射公式同时记录 source_equation（原文编号）与 local_equation（讲义/译本标签）字段（审查 11 🟡7）；顶层 JSON Schema 校验（审查 12 🟡12）"
    phase_convention:   # 审查 12 🔴4：机器化锁定
      condon_shortley: "P_l^m 采用 Condon–Shortley 相位（含 (−1)^m）；SciPy lpmv/sph_harm_y 已含——实现必须与 SciPy 一致并测试奇数 m 翻相"
      Y_lm_normalization: "Y_lm = N_lm P_l^m(cosθ) e^{imφ}，N_lm = √[(2l+1)/(4π)·(l−m)!/(l+m)!]（正交归一）；Y_{l,−m} = (−1)^m Y*_lm"
      X_lm_phase: "X_lm = [l(l+1)]^{-1/2} r×∇Y_lm 整体相位以 Jackson 为基准；讲义 04_projection.tex:289-295 承认讲义与 Grahn 的 X_lm 差一个 i——实现统一按 Grahn 原文 Eq.(1)(2) 的 X_lm 定义，禁止混用讲义版"
      scipy_api: "sph_harm_y 参数顺序 (l, m, theta=polar, phi=azimuth)（非旧 sph_harm 顺序）；实现前用 known-vector 探针测试"
      probe_test: "零阶探针：l=1,m=0/±1 的 Y_lm、X_lm 与解析值逐项比对（含相位），不得只测模平方"
    forbidden_source_paths:   # 审查 12 🔴1：残留错误公式源黑名单（生成型代码禁止抄取）
      - "vector-multipole-derivation/sections/06_current_integral.tex:116-123,122,181（Eq.(13) 第二项错写 (d²/dr²+k²)r∇·J）"
      - "vector-multipole-derivation/sections/07_integration_parts.tex:119,133-150,264（Eq.(13) 第二项错写 + O_lm 简写漏 1/√(l(l+1))·√((2l+1)/4π)）"
      - "vector-multipole-derivation/sections/12_unified.tex:315,330（同两类错误）"
      - "vector-multipole-derivation/sections/04_projection.tex:289-295（X_lm 相位差 i，未锁）"
      - "grahn2012-chinese.tex:207-212（Eq.(13) 第二项转录错误）"
      - "alaee2018-chinese.tex:206-207（/c 残留，应为 /c²）"
      - "12_unified.tex:374（'1/c 因子' 残留，应为 1/c²）"
  incident: "x 偏振、z 传播平面波（原文 (21)）；E₀ = 1 V/m（SI，显式）"
  J_S:
    formula: "J_S(r) = −iω(ε − ε_d) E(r)   [原文 (6)：J_S = −iωε₀(ε_r − ε_rd)E]"
    field: "E = 总场 = 入射 + 散射（单球情形 = Mie 解析内部场，复用 c_n/d_n）"
  current_multipole_tensor:
    formula: "M^(l) = i/[(l−1)! ω] ∫ J r r⋯r d³r   [原文 Eq.(27)，非 Eq.(12)]"
    l1: "M^(1) = p（电偶极矩，3 分量）"
    l2: "M^(2)_αβ = i/ω ∫ J_α r_β d³r —— 9 分量一般 3×3 原始矩，**不对称**（审查 09 🔴1）"
    l3: "M^(3) = O（八极）：O_αβγ = i/(2ω) ∫ J_α r_β r_γ d³r；**对称性 O_αβγ = O_αγβ（后两指标）** → 27 元仅 18 独立（审查 10 🟡1，原文物理页 8 例 O_xyz=O_xzy）"
  M3_symmetry_test: "3×3×3 数组断言 O[α,β,γ] == O[α,γ,β] 全部成立（shape/schema 可执行断言，审查 11 🟡6）"
  M2_four_objects:  # 审查 09 🔴1/🟡4：四个显式区分、归一化明确的对象
    M2_raw: { def: "M2_raw[αβ] = i/ω ∫ J_α r_β d³r", shape: "3×3 complex", note: "9 分量原始矩" }
    M2_sym_traceless: { def: "½(M2+M2ᵀ) − ⅓ I·tr(M2)", dim: 5, note: "对称无迹 → Q^e 相关；Q^e = 6·STF(M2_raw)" }
    M2_antisym: { def: "½(M2−M2ᵀ)", dim: 3, note: "对偶 m_γ = (iω/2)ε_γαβ M2_αβ = ½∫(r×J)_γ d³r → 磁偶极" }
    M2_trace: { def: "⅓ I·tr(M2)", dim: 1, note: "暗模式，球对称四极不辐射" }
    reconstruction_test: "M2_raw = M2_sym_traceless + M2_antisym + M2_trace 逐元素重构（随机复 3×3 张量测试）"
  Qe_stf_conversion:
    formula: "Q^e = 6·STF(M2_raw)，STF(M2) = ½(M2+M2ᵀ) − ⅓ I·tr(M2)"
    domain: "**仅长波（无 Bessel 核）成立**（审查 09 🔴2）：Alaee Table 2 的 Q^e 含 j₁(kr)/(kr) 与 j₃(kr)/(kr)³，有限 kr 下不得等同于 6·STF(M2)"
    table1_rank4: "⚠️ 审查 10 🟡2：6·STF(M2) 只对应 Alaee 表 1 EQ 的**最低阶（k⁰）**项；完整表 1 EQ 含 k² rank-4 修正，在有限 kr 下也不等同。比较路径 A 时按通道报告截断阶"
    forbidden: "Table 2 精确 Q^e **禁止**直接喂 Grahn 张量映射（路径 A 只用 M^(l) 原始矩的无核形式）"
    finite_kr_counterexample:   # 审查 12 🟡5：范数/分母锁定
      current: "J = J₀ ẑ x f(r)（x 偏移极化）"
      kr: 0.5
      kr_note: "kr = kR = 0.5（R=1.0 球，k=0.5）——**kr 实指 kR**"
      norm_definition: "范数 = 复数张量各分量模平方和开方（Frobenius）；分母 = |Table-2 精确矩|（审查 12 建议精确 Table-2 范数）"
      component_selection: "逐分量比较（6·STF(M2)_αβ vs Table-2 精确 Q^e_αβ 的每个非零分量），不只看范数"
      computation: "6·STF(M2) 相关分量系数 ≈ 0.17408 vs Table-2 精确 EQ ≈ 0.17241（Frobenius 口径相对差 ≈ 0.97%）"
      error_separation: "数值积分误差（网格收敛 <0.1%）与长波截断误差（6·STF vs Table-2 的固有差）**分别判定**；gate 只判长波截断差 > 0.5%（预注册）"
      assertion: "逐分量相对差 > 0.5%（预注册，非 1%——实测 0.97% 不满足 >1%）；同时 kr→0（x_alaee≤0.02）断言 < 1%（长波收敛）"
  mapping_E2:   # 原文 (39)(40)(41)
    input_contract:
      source_object: "M2_raw"
      equivalent_numeric_input: "M2_stf"
      allowed_api_values: ["raw", "stf"]
      forbidden_api_value: "qe"
      qe_to_e2_conversion: "Qe/6"
      m1_input: "M2_raw_antisymmetric_part"
    projection_reason: "Grahn (39)–(41) 的对角差、非对角和与 2Qzz−Qxx−Qyy 消去 M2_raw 的迹和反对称部分；故 raw 与 STF 数值等价。Grahn 原文 Q 仍是 Eq.(27) 的 M2_raw，不是 Alaee Qe。"
    a_E_2_pm2: { formula: "a_E(2,±2) = 3C₂(Q_xx − Q_yy ∓ i(Q_xy + Q_yx))", source_equation: "(39)", local_equation: "eq:mapping_E2_2" }
    a_E_2_pm1: { formula: "a_E(2,±1) = 3C₂(∓(Q_xz+Q_zx) + i(Q_yz+Q_zy))", source_equation: "(40)", local_equation: "eq:mapping_E2_1" }
    a_E_2_0: { formula: "a_E(2,0) = √6 C₂(2Q_zz − Q_xx − Q_yy)", source_equation: "(41)", local_equation: "eq:mapping_E2_0" }
  mapping_E1:   # 原文 (42)(43) —— 审查 09 🔴5：非 p-only
    a_E_1_pm1: { formula: "a_E(1,±1) = C₁(∓p_x + i p_y) + 7C₃[±(O_xxx+2O_xyy+2O_xzz−O_yyx−O_zzx) − i(O_yyy+2O_yxx+2O_yzz−O_xxy−O_zzy)]", source_equation: "(42)", local_equation: "eq:mapping_E1" }
    a_E_1_0: { formula: "a_E(1,0) = √2 C₁ p_z + 7√2 C₃(O_xxz+O_yyz−O_zzz−2O_zxx−2O_zyy)", source_equation: "(43)", local_equation: "eq:mapping_E1_0" }
    p_only_switch: { default: false, type: boolean, note: "p-only（丢 7C₃O 项）仅最低阶截断显式开关；默认关闭；测试：零净偶极但非零八极电流在 off 时不得判为零" }
  mapping_M2:   # 原文 (44)(45)(46) —— 审查 09 🔴4：磁四极必须纳入
    a_M_2_pm2: { formula: "a_M(2,±2) = 7C₃[±(−O_xxz+O_yyz+O_zxx−O_zyy) + i(O_xyz+O_yzx−2O_zxy)]", source_equation: "(44)", local_equation: "eq:mapping_M2_2" }
    a_M_2_pm1: { formula: "a_M(2,±1) = 7C₃[−O_xyy+O_xzz+O_yyx−O_zzx ∓ i(−O_yxx+O_yzz+O_xxy−O_zzy)]", source_equation: "(45)", local_equation: "eq:mapping_M2_1" }
    a_M_2_0: { formula: "a_M(2,0) = 7√6 i C₃(O_xyz − O_yzx)", source_equation: "(46)", local_equation: "eq:mapping_M2_0" }
  mapping_M1:   # 原文 (47)(48)
    input_contract:
      source_object: "M2_raw"
      used_part: "M2_antisym"
      forbidden_inputs: ["M2_stf", "Qe"]
    a_M_1_pm1: { formula: "a_M(1,±1) = 5C₂(−Q_xz+Q_zx ∓ i(−Q_yz+Q_zy))", source_equation: "(47)", local_equation: "eq:mapping_M1_1" }
    a_M_1_0: { formula: "a_M(1,0) = 5√2 i C₂(−Q_xy+Q_yx)", source_equation: "(48)", local_equation: "eq:mapping_M1_0" }
    note: "磁偶极来自 Q 的**反对称组合**（审查 R2 铁律：错喂对称 Q^e → 磁偶极消失）"
  Qm_O_bridge:   # 审查 10 🟡6
    formula: "Q^m_αβ = −2iω(ε_βγδ O_δαγ + ε_αγδ O_δβγ)"
    properties: "断言 Q^m 对称、无迹（主 agent 代数验证 + 审查 11 独立确认）"
    test: "逐 m 比较 Grahn a_M(2,m) ↔ Mie b_2（TE 磁四极）与 Alaee Table 1 Q^m 通道——结构化复数比例/相位/容差（审查 11 🟡6）"
  coefficients:
    C1: "−ik³/(6πε_d E₀)"
    C2: "−k⁴/(60πε_d E₀)"
    C3: "−ik⁵/(210πε_d E₀)"
    note: "原文 (48) 后 inline；ε = ε_d = host 绝对介电常数（审查 🟡2）；k = k_d = host 波数"
  C_sca:
    formula: "C_s = (π/k²) Σ_{l=1}^∞ Σ_{m=−l}^{l} (2l+1)(|a_E(l,m)|² + |a_M(l,m)|²)   [原文 Eq.(20)]"
    m_sum: "任意入射全 Σ_{m=−l}^{l}（审查 09 🟡1）；球体简化（居中球、x 偏振、z 传播 → 入射场仅 m=±1）作独立简化路径；**通用全 m 与球体简化两条都测**，四极 m=0,±2 不静默丢弃"
  normalization:   # 审查 10 🔴3 + 审查 11 🔴6：唯一口径 + 逐 m 目标
    canonical_unit: "C_sca/(λ_d²/2π)，λ_d = 2π/k_d（host 波长）——唯一口径，不用 'm²（或归一化）'"
    SI_dimensionality: "p/m/Q^e/Q^m 是 SI 有量纲矩（保留 SI 定义）；C_sca 输出归一化为 C_sca/(λ_d²/2π)（无量纲）；不声称 '所有无量纲矩按 SI 定义'（审查 11 🔴6 自相矛盾修正）"
    per_m_targets:   # 审查 11 🔴6：逐项目标（球体 x 偏振 z 传播）
      a_E_1: { m_plus_1: "-a_l", m_minus_1: "+a_l", note: "l=1 电偶极，逐项复系数" }
      a_E_2: { m_plus_1: "-a_l", m_minus_1: "+a_l", note: "l=2 电四极" }
      a_M_1: { m_plus_1: "-b_l", m_minus_1: "-b_l", note: "l=1 磁偶极" }
      a_M_2: { m_plus_1: "-b_l", m_minus_1: "-b_l", note: "l=2 磁四极" }
      tolerance: { relative: 0.01, absolute_floor: 1.0e-6, zero_target_abs: 1.0e-8, note: "逐 m 复系数：分母 |Mie 系数|，mask < 1e-4 → absolute floor；零目标（等价性 m=±1）用 absolute-zero（审查 12 🔴2 数值化）" }
    summed_relations: "Σ_{m=±1}|a_E(l,m)|² = 2|a_l|²、Σ_{m=±1}|a_M(l,m)|² = 2|b_l|²、Σ_{m=±1} m·a_E(l,m) = −2a_l、Σ_{m=±1} a_M(l,m) = −2b_l（由 per_m_targets 推出）"
    alaee_eq1_full: "Alaee Eq.(1) 完整机器化（/c² 版，讲义 12_unified 已核）：C_sca = k⁴/(6πε₀²|E_inc|²)[Σ_α(|p_α|² + |m_α|²/c²) + (1/120)Σ_αβ(|kQ^e_αβ|² + |kQ^m_αβ|²/c²) + …]。⚠️ 真相源 alaee2018-chinese.tex L206-207 仍残留错误 /c（审查 10 🔴3），以讲义 12_unified 的 /c² 为准；任何生成型代码不得从残留源再抄公式（审查 11 🟡9）"
  kernel_paths:
    path_B_integral_raw:   # 原文 Eq.(13)(14) 逐字（字形级核实）
      formula: "a_E(l,m) = (−i)^{l−1}kη/(E₀[π(2l+1)l(l+1)]^{1/2}) ∫ Y*_lm(θ,φ) j_l(kr) {k² r·J_S + (2 + r·d/dr)(∇·J_S)} d³r；a_M(l,m) = (−i)^{l−1}k²η/(E₀[π(2l+1)l(l+1)]^{1/2}) ∫ Y*_lm(θ,φ) j_l(kr) r·(∇×J_S) d³r"
      notes: ["第一项 r 是位置向量（非 r̂）", "第二项是 (2+rd/dr)(∇·J_S) 非 (d²/dr²+k²)r∇·J_S（译本转录错误勘误）"]
    path_B_clean_full:   # 原文 Eq.(15)(16) 完整（实现首选）
      formula: "a_E(l,m) = (−i)^{l−1}k²η O_lm/(E₀[π(2l+1)]^{1/2}) ∫ exp(−imφ) {[Ψ_l(kr)+Ψ''_l(kr)] P_l^m(cosθ) r̂·J_S + Ψ'_l(kr)/(kr) [τ_lm(θ) θ̂·J_S − iπ_lm(θ) φ̂·J_S]} d³r；a_M(l,m) = (−i)^{l+1}k²η O_lm/(E₀[π(2l+1)]^{1/2}) ∫ exp(−imφ) j_l(kr) [iπ_lm(θ) θ̂·J_S + τ_lm(θ) φ̂·J_S] d³r"
      notes: ["相位：a_E 用 (−i)^{l−1}、a_M 用 (−i)^{l+1}（勿混）", "Ψ_l(kr) = kr·j_l(kr)，Ψ'、Ψ'' 对宗量 kr 求导"]
    path_B_defs:   # 原文 Eq.(17)(18)(19)
      O_lm: "1/[l(l+1)]^{1/2}·[(2l+1)/(4π)·(l−m)!/(l+m)!]^{1/2}"
      tau_lm: "τ_lm(θ) = d/dθ P_l^m(cosθ)"
      pi_lm: "π_lm(θ) = m/sinθ·P_l^m(cosθ)"
      pole_note: "⚠️ 审查 11 🟡2：π_lm 在 θ=0,π 是可去奇性（P_l^m~sin^{|m|}θ 相消）。规定：用 μ=cosθ 的 Gauss–Legendre 内点（不取端点）或解析极限/稳定递推；禁止直接在 θ=0,π 做除法。m=±1,±2 加极点邻域测试"
    psi_double_prime:   # 审查 11 🟡2：Ψ'' 数值实现
      formula: "j''_l(ρ) = [l(l+1)/ρ² − 1] j_l(ρ) − (2/ρ) j'_l(ρ)；Ψ'_l = j_l + ρ j'_l；Ψ''_l = 2j'_l + ρ j''_l"
      rho0: "ρ→0 用级数极限（j_l(ρ)~ρ^l/(2l+1)!!），禁止数值二阶差分"
      note: "scipy 只给 j_l 与 j'_l，j'' 用此递推或 Riccati 方程（审查 11 盲区 18）"
    direct_derivative_cross_restriction: "审查 10 🔴5：Eq.(13)(14) 的直接导数交叉（∇·J_S、∇×J_S 数值）**只允许用于全空间 C¹/C²、边界连同所需导数一起消失的解析 bump 电流**；真实球（J_S 在 r=a 不连续，导数含表面分布项）只以 Eq.(15)(16) 为主。朴素有限差分不得作为 gate"
    far_field_projection: "原文 Eq.(3)(4)：a_E/a_M 从包围球面上 E_s 的角向积分——独立路径 ①（不依赖内部场/J）"
  dual_paths:
    path_A: "无核张量映射：M^(l)（原文 (27)，无 Bessel 核）→ 张量分解（M2 四对象）→ (35)–(48) 映射 → a_E/a_M → C_s (20)。对照：Alaee Table 1 长波近似（同无核域）。域：低-kr [0.02, 0.3]。逐通道报告 rank 截断阶（审查 10 🟡2/结论 4）"
    path_B: "核积分：原文 (13)(14)/(15)(16)（含 j_l/Ψ_l 核）→ a_E/a_M → C_s (20)。对照：Mie per-multipole。域：全域 [0.02, 1.0]（含低端 0.02–0.2 与 path A 重叠 + Rayleigh 斜率）"
    forbidden_mix: "审查 09 🔴3：两路径不得混淆——Table 2 精确矩（核）不得与 Grahn 无核张量映射（路径 A）混比；双路径一致性是诊断，不单独作为 gate"
    path_A_truth_source: "⚠️ 审查 11 🟡4/结论 5：path A 与 Table 1 是同阶长波近似（共享 J_S），两者相符不证明逼近真值。**path A vs exact Mie、Table 1 vs exact Mie 各自逐通道误差和小宗量误差阶都必须报告**；A vs Table 1 仅作代数诊断"
  error_injection_targets: "审查 10 结论 2.1 + 审查 11：r↔r̂、Ψ_l 导数、τ/π 函数、(−i)^{l±1} 相位、a/b 标签、m=0/±1/±2 丢弃、坐标平移、相位约定、j'' 递推——全部要有错误注入测试"

