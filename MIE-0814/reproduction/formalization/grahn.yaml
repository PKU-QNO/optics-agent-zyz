solver:
  type: "解析 Mie 内部场 + 体积分（M^(l) 矩 / 核积分）——不是 FEM，不是拟合"
  strategy: |
    1. 内部场：Mie c_n/d_n 解析（复用 code/mie_theory.py）→ E_in → J_S = −iω(ε−ε_d)E；
    2. 路径 B 主实现：球坐标体积分实现原文 (15)(16)（O_lm/τ_lm/π_lm/Ψ_l 核，相位 (−i)^{l±1}，Ψ'' 用递推）→ a_E/a_M → C_s (20)；
    3. 路径 B 交叉：Eq.(13)(14) 直接数值（含 ∇·J_S、∇×J_S）**仅用于解析 bump 电流**（见 direct_derivative_cross_restriction），比对 (15)(16)；
    4. 路径 A：M^(l) 无核体积分（原文 (27)）→ M2 四对象分解（M3 18 独立断言）→ (39)–(48) 映射（含磁四极 (44)–(46)、a_E(1,m) 含八极项）→ C_s (20)；
    5. 对照：Alaee Table 1 矩（复用 code/multipole_approx.py）→ Alaee Eq.(1) C_sca（低-kr 域，/c² 版）；Mie per-multipole（复用 code/baseline_mie.py）→ C_sca（全域）；**path A/Table 1 各自对 Mie 真值报告误差**（审查 11 🟡4）；
    6. 独立路径：远场投影 (3)(4)（独立 VSH 实现，见 dependency_graph）+ miepython + 解析电流基准（analytic_benchmarks）；
    7. 光学定理：新增 Grahn Eq.(22) 相位敏感测试（grahn_optical_theorem）+ 复用 Mie Y8；
    8. m 求和：通用全 m（l≤2 即 m=0,±1,±2 全保）与球体简化（m=±1）双路径都跑；逐 m 目标（normalization.per_m_targets）锁相位/符号。
  m_truncation: "l ≤ 2（电偶极/电四极/磁偶极/磁四极）；l=3 八极映射 (35)–(38) 仅用于解析基准与 a_E(1,m) 的 O 修正项、Q^m-O 桥，不作为 C_sca 验收通道"
  environment: "本地 Python（numpy + scipy + matplotlib）；miepython 交叉（见 verification.miepython_gate）；独立 VSH 实现见 dependency_graph"
  n_max: "Wiscombe x + 4x^{1/3} + 2（仅 Mie 基准总截面用；l≤2 分项不与 Wiscombe 总和混比，审查 10 衔接 ✓）"

